name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nave_demo_test
          POSTGRES_USER: nave_demo
          POSTGRES_PASSWORD: nave_demo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nave_demo -d nave_demo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nave_demo:nave_demo_ci@localhost:5432/nave_demo_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - name: Aplicar migrations
        run: npx prisma migrate deploy
      - name: Testes e2e (API + PostgreSQL real)
        run: npm run test:e2e -- --ci
      - run: npm run build

  frontend:
    name: Frontend (lint, tipos, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Stack Docker (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Subir a stack completa
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: API saudável e seed carregado
        run: |
          curl -fsS http://localhost:3001/health
          curl -fsS -X POST http://localhost:3001/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"gestora.demo@example.com","senha":"NaveDemo@2026"}' | grep -q access_token
      - name: Interface respondendo
        run: curl -fsS http://localhost:3000/login | grep -qi "nave"
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
