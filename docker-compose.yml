services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nave_demo
      POSTGRES_USER: nave_demo
      POSTGRES_PASSWORD: nave_demo_local
    ports:
      - "5432:5432"
    volumes:
      - nave_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nave_demo -d nave_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nave_demo_postgres:
